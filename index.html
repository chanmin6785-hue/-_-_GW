<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대학 학과 정보 조회</title>
  <style>
    :root {
      --bg: #f6f8fb; --panel: #ffffff; --ink: #172033; --muted: #687387;
      --line: #dbe2ec; --accent: #1769aa; --accent-dark: #0f4d80;
      --soft: #eaf4fb; --danger: #b3261e;
    }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
    header { background: #0b5f9a; color: #fff; padding: 24px; }
    main { width: min(1200px, calc(100% - 32px)); margin: 24px auto; display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: 0; border-radius: 6px; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    .pill { background: var(--soft); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--accent); }
    .table-wrap { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f0f5f9; padding: 12px; text-align: left; border-bottom: 2px solid var(--line); }
    td { padding: 12px; border-bottom: 1px solid var(--line); }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>대학 학과 정보 조회</h1>
    <p>한국대학교육협의회 공공데이터 기반 학과 검색 서비스</p>
  </header>
  <main>
    <section>
      <form id="searchForm">
        <label>학교명</label>
        <input name="schoolName" placeholder="예: 서울대학교">
        <label>학과명</label>
        <input name="majorName" placeholder="예: 컴퓨터공학과">
        <label>조사년도 (복수 입력 시 쉼표 사용)</label>
        <input name="svyYr" value="2025" placeholder="예: 2025, 2024">
        <button id="submitBtn" type="submit">조회하기</button>
      </form>
      <p id="timeEstimate" style="margin-top: 15px; font-size: 13px; color: var(--muted);"></p>
    </section>
    <section>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <strong>조회 결과</strong>
        <span id="resultCount" class="pill">대기 중</span>
      </div>
      <div id="resultArea" class="table-wrap">
        <p style="color: var(--muted);">학교명 또는 학과명을 입력하고 조회를 시작하세요.</p>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const resultArea = document.getElementById("resultArea");
    const timeEstimate = document.getElementById("timeEstimate");

    // 예상 시간 계산 함수
    function updateEstimate() {
      const school = form.schoolName.value.trim();
      const major = form.majorName.value.trim();
      const years = form.svyYr.value.split(',').length;
      let text = "";
      if (school || major) {
        if (school && major) text = `예상 시간: 약 ${years * 2}~${years * 5}초`;
        else if (school) text = `예상 시간: 약 ${years * 3}~${years * 7}초`;
        else text = `예상 시간: 약 ${years * 30}초 ~ 2분 (전국 조회)`;
      }
      timeEstimate.textContent = text;
    }

    form.addEventListener("input", updateEstimate);

    form.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true; btn.textContent = "조회 중...";
      
      try {
        const params = new URLSearchParams(new FormData(form));
        const res = await fetch(`/api/search?${params.toString()}`);
        const data = await res.json();
        
        document.getElementById("resultCount").textContent = `총 ${data.totalCount}건`;
        renderTable(data.items);
      } catch (err) {
        alert("조회 중 오류가 발생했습니다.");
      } finally {
        btn.disabled = false; btn.textContent = "조회하기";
      }
    };

    function renderTable(items) {
      if (!items.length) {
        resultArea.innerHTML = "<p>조회된 정보가 없습니다.</p>";
        return;
      }
      let html = `<table><thead><tr><th>년도</th><th>학교명</th><th>학과명</th><th>계열</th><th>지역</th><th>상태</th></tr></thead><tbody>`;
      items.forEach(item => {
        html += `<tr>
          <td>${item.svyYr || '-'}</td>
          <td>${item.korSchlNm || '-'}</td>
          <td>${item.korMjrNm || '-'}</td>
          <td>${item.korSrsMclftNm || '-'}</td>
          <td>${item.mjrAreaNm || '-'}</td>
          <td>${item.schlMjrStatNm || '-'}</td>
        </tr>`;
      });
      html += "</tbody></table>";
      resultArea.innerHTML = html;
    }
  </script>
</body>
</html>
