<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대학 학과 정보 조회 서비스</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .search-box { background: #f4f4f4; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .input-group { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; }
        input[type="text"] { padding: 5px; width: 250px; }
        .info { font-size: 0.9em; color: #666; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #0b70b9; color: white; }
        #loading { display: none; font-weight: bold; color: #0b70b9; }
    </style>
</head>
<body>
    <h1>🎓 대학 학과 정보 조회</h1>
    
    <div class="search-box">
        <div class="input-group">
            <label>학교명</label>
            <input type="text" id="univInput" placeholder="예: 서울대학교">
        </div>
        <div class="input-group">
            <label>학과명</label>
            <input type="text" id="majorInput" placeholder="예: 컴퓨터공학">
        </div>
        <div class="input-group">
            <label>조사년도</label>
            <input type="checkbox" name="year" value="2025"> 2025
            <input type="checkbox" name="year" value="2024"> 2024
            <span class="info">(복수 선택 가능)</span>
        </div>
        <button onclick="performSearch()" style="padding: 10px 20px; cursor: pointer;">검색하기</button>
        <p id="timer" class="info">조회 예상 시간: 약 1.5초</p>
    </div>

    <div id="loading">데이터를 불러오는 중입니다...</div>
    <div id="resultCount"></div>
    <table id="resultTable">
        <thead>
            <tr>
                <th>조사년도</th>
                <th>학교명</th>
                <th>학과명</th>
                <th>전공분야</th>
                <th>입학정원</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>

    <script>
        async function performSearch() {
            const univ = document.getElementById('univInput').value;
            const major = document.getElementById('majorInput').value;
            const years = Array.from(document.querySelectorAll('input[name="year"]:checked')).map(cb => cb.value);
            const loading = document.getElementById('loading');
            const resultBody = document.getElementById('resultBody');

            if (!univ && !major) {
                alert("학교명 또는 학과명 중 하나는 반드시 입력해야 합니다.");
                return;
            }

            loading.style.display = 'block';
            resultBody.innerHTML = '';

            // 실제 구현 시에는 위 Python 백엔드 엔드포인트(예: http://localhost:8000/search)를 호출합니다.
            // 아래는 로직 예시를 위한 구조입니다.
            console.log("검색 조건:", { univ, major, years });

            // API 호출 시뮬레이션 및 결과 출력 로직 (생략 - 백엔드 연결 필요)
            // 학교명 완전 일치 우선 로직은 백엔드에서 처리되어 전달됩니다.
            
            setTimeout(() => {
                loading.style.display = 'none';
                document.getElementById('resultCount').innerText = "조회된 결과가 없습니다. (백엔드 서버 연결 필요)";
            }, 1500);
        }
    </script>
</body>
</html>
