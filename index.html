<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학 학과 정보 검색</title>

    <style>

        body{
            margin:0;
            font-family:sans-serif;
            background:#f4f6fb;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:auto;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#1d4ed8;
        }

        .search-box{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border-radius:10px;
            border:1px solid #ccc;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:20px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .error{
            color:red;
            text-align:center;
            margin-top:20px;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>🎓 대학 학과 정보 검색</h1>

    <div class="search-box">

        <input
            type="text"
            id="apikey"
            placeholder="a6428411d2a2e278131a879838396d58c6659ab1a9e6af9fa43699cccd452c16"
        >

        <input
            type="text"
            id="university"
            placeholder="대학교 이름 입력"
        >

        <button onclick="searchMajor()">
            검색
        </button>

    </div>

    <div id="result"></div>

</div>

<script>

async function searchMajor(){

    const key = document.getElementById('apikey').value;
    const university = document.getElementById('university').value;

    const resultDiv = document.getElementById('result');

    resultDiv.innerHTML = "검색 중...";

    const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(
        `http://openapi.academyinfo.go.kr/openapi/service/rest/SchoolMajorInfoService/getSchoolMajorInfo?serviceKey=${key}&pageNo=1&numOfRows=20&svyYr=2023&schlKrnNm=${university}`
    )}`;

    try{

        const response = await fetch(url);

        const text = await response.text();

        const parser = new DOMParser();

        const xml = parser.parseFromString(text, "text/xml");

        const items = xml.getElementsByTagName('item');

        if(items.length === 0){
            resultDiv.innerHTML = '<p class="error">검색 결과가 없습니다.</p>';
            return;
        }

        let html = '';

        for(let item of items){

            const major = item.getElementsByTagName('mjrNm')[0]?.textContent || '-';
            const college = item.getElementsByTagName('clgNm')[0]?.textContent || '-';
            const degree = item.getElementsByTagName('degCrseNm')[0]?.textContent || '-';
            const duration = item.getElementsByTagName('corseDurCtnt')[0]?.textContent || '-';
            const daynight = item.getElementsByTagName('dghtDivNm')[0]?.textContent || '-';

            html += `
                <div class="card">
                    <h2>${major}</h2>
                    <p><b>단과대학:</b> ${college}</p>
                    <p><b>학위과정:</b> ${degree}</p>
                    <p><b>수업연한:</b> ${duration}</p>
                    <p><b>주야구분:</b> ${daynight}</p>
                </div>
            `;
        }

        resultDiv.innerHTML = html;

    }catch(error){

        resultDiv.innerHTML = `
            <p class="error">
                오류 발생<br>
                API 키 또는 대학 이름을 확인하세요.
            </p>
        `;

        console.error(error);
    }
}

</script>

</body>
</html>
