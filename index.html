<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대학 학과 정보 검색 서비스</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .search-box { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>대학 학과 정보 검색</h1>
    
    <div class="search-box">
        <input type="text" id="keyword" placeholder="학과명을 입력하세요 (예: 컴퓨터)">
        <button onclick="searchDept()">검색</button>
    </div>

    <table id="resultTable">
        <thead>
            <tr>
                <th>대학명</th>
                <th>학과명</th>
                <th>전공분야</th>
                <th>입학정원</th>
                <th>지역</th>
            </tr>
        </thead>
        <tbody id="resultBody">
            </tbody>
    </table>

    <script>
        async function searchDept() {
            const keyword = document.getElementById('keyword').value;
            const response = await fetch(`/search?keyword=${encodeURIComponent(keyword)}`);
            const data = await response.json();
            
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = ''; // 기존 결과 초기화

            if (data.response && data.response.body && data.response.body.items) {
                const items = data.response.body.items;
                items.forEach(item => {
                    const row = `<tr>
                        <td>${item.insttNm || '-'}</td>
                        <td>${item.mdeptNm || '-'}</td>
                        <td>${item.atunmField || '-'}</td>
                        <td>${item.entrncTcnt || '-'}</td>
                        <td>${item.lcNm || '-'}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="5">결과가 없습니다.</td></tr>';
            }
        }
    </script>
</body>
</html>
